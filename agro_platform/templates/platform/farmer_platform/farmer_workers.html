{% load static %}
<link rel="stylesheet" href="{% static 'css/farmer_platform.css' %}">

<div class="navbar">
    <div class="logo">AgroAssist</div>
    <li><a href="/"class="back-btn">Home</a></li>
    <a href="{% url 'farmer_platform' %}">Back</a>
</div>

<div class="container">
    <h1 class="page-title">👷 Skilled Workers</h1>

    <div class="grid">
        {% for w in workers %}
        <div class="card">
            <h3>{{ w.name }}</h3>
            <p>Skill: {{ w.skill }}</p>
            <p>Daily Wage: ₹{{ w.daily_wage }}</p>
        </div>
        {% empty %}
        <p>No workers available.</p>
        {% endfor %}
    </div>
</div>
