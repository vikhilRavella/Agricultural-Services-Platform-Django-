{% load static %}
<link rel="stylesheet" href="{% static 'css/farmer_platform.css' %}">

<div class="navbar">
    <div class="logo">AgroAssist</div>
    <li><a href="/" class="back-btn" >Home</a></li>
    <a href="{% url 'farmer_platform' %}">Back</a>
</div>

<div class="container">
    <h1 class="page-title">🚜 Equipment Booking</h1>

    <div class="grid">
        {% for e in equipment %}
        <div class="card">
            <h3>{{ e.name }}</h3>
            <p>₹{{ e.price_per_day }} / day</p>
        </div>
        {% empty %}
        <p>No equipment available.</p>
        {% endfor %}
    </div>
</div>
